<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Git Tags</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17212b;
            --muted: #65727e;
            --accent: #e65f3f;
            --accent-dark: #b83f27;
            --surface: rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(230, 95, 63, 0.2), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(42, 117, 156, 0.18), transparent 30%),
                #f3efe8;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 1rem;
            z-index: -1;
            border: 1px solid rgba(23, 33, 43, 0.12);
            pointer-events: none;
        }

        h1,
        p {
            margin-top: 0;
        }

        h1 {
            max-width: 12ch;
            margin-bottom: 1.25rem;
            font-size: clamp(2.75rem, 8vw, 6.5rem);
            line-height: 0.95;
            letter-spacing: -0.03em;
        }

        h1::after {
            content: "";
            display: block;
            width: 4rem;
            height: 0.35rem;
            margin-top: 1.5rem;
            background: var(--accent);
        }

        p {
            margin-bottom: 0.65rem;
            color: var(--muted);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            line-height: 1.6;
        }

        p:first-of-type {
            max-width: 34rem;
            margin-bottom: 2.5rem;
            color: var(--ink);
            font-size: clamp(1.1rem, 2vw, 1.35rem);
        }

        p:nth-of-type(n + 2) {
            font-size: 0.85rem;
        }

        p:last-child {
            display: inline-block;
            padding-top: 0.65rem;
            border-top: 1px solid rgba(23, 33, 43, 0.18);
            color: var(--accent-dark);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            body {
                place-items: end start;
                padding: 2rem;
            }

            body::before {
                inset: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <h1>Sistema de Clientes</h1>

    <p>Versão inicial do sistema.</p>

    <p>Autor: Luciano Neiva</p>
    <p>Treinamento github</p>

</body>

</html>
